name: Deploy to VM

on:
  # Deploy whatever is on main. A merged PR counts as a push to main, so the
  # normal branch -> PR -> merge flow now reaches the VM without anyone having
  # to remember the Actions tab. Feature branches deliberately do NOT deploy.
  push:
    branches: [main]
  workflow_dispatch:

# The job builds in place on the VM (git pull, npm ci, npm run build, all in
# /var/www/zoiko-suite/app). Two runs at once would interleave in that one
# directory and leave a half-built tree, which manual dispatch made unlikely and
# auto-deploy makes routine. Queue instead of cancelling: a cancelled run can
# stop mid npm ci and strand the VM with no node_modules.
concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd /var/www/zoiko-suite/app
            git reset --hard HEAD
            git clean -fd
            git pull origin main
            npm ci
            export NODE_OPTIONS="--max-old-space-size=4096"
            npm run build
            pm2 restart zoiko-suite
