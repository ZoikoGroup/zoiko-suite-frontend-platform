name: Deploy to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets are configured
        env:
          SSH_HOST: ${{ secrets.GCP_SSH_HOST }}
          SSH_USER: ${{ secrets.GCP_SSH_USER }}
          SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" || { echo "GCP_SSH_HOST is not configured" >&2; exit 1; }
          test -n "$SSH_USER" || { echo "GCP_SSH_USER is not configured" >&2; exit 1; }
          test -n "$SSH_KEY" || { echo "GCP_SSH_KEY is not configured" >&2; exit 1; }
          case "$SSH_KEY" in
            *"BEGIN "*" PRIVATE KEY-----"*"END "*" PRIVATE KEY-----"*) ;;
            *) echo "GCP_SSH_KEY does not look like a complete private key" >&2; exit 1 ;;
          esac

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 30m
          script_stop: true
          script: |
            echo "===== VM ENVIRONMENT ====="
            echo "user:   $(whoami)"
            echo "node:   $(node -v 2>&1 || echo 'MISSING')"
            echo "npm:    $(npm -v 2>&1 || echo 'MISSING')"
            echo "pm2:    $(command -v pm2 || echo 'NOT ON PATH')"
            echo "--- pm2 processes ---"
            pm2 list 2>&1 || echo 'pm2 list failed'
            echo "=========================="
            echo "##### PHASE 1: cd to app dir #####"
            cd /var/www/zoiko-suite/app
            echo "##### PHASE 2: reset working tree #####"
            git reset --hard HEAD
            git clean -fd
            echo "##### PHASE 3: pull main #####"
            git pull origin main
            echo "deploying commit: $(git rev-parse --short HEAD) $(git log -1 --pretty=%s)"
            echo "##### PHASE 4: npm ci #####"
            npm ci
            echo "##### PHASE 5: next build #####"
            export NODE_OPTIONS="--max-old-space-size=4096"
            npm run build
            echo "##### PHASE 6: pm2 restart #####"
            pm2 restart zoiko-suite
            echo "##### DEPLOY OK #####"
            pm2 list
