name: Deploy to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/gha_deploy_key
          chmod 600 ~/.ssh/gha_deploy_key

      - name: Deploy via IAP tunnel
        run: |
          gcloud compute ssh lennox@zoiko-suite-platform-frontend \
            --zone=europe-north1-a \
            --tunnel-through-iap \
            --ssh-key-file=~/.ssh/gha_deploy_key \
            --command='
              set -e
              cd /var/www/zoiko-suite/app
              git reset --hard HEAD
              git clean -fd
              git pull origin main
              echo "deploying commit: $(git rev-parse --short HEAD) $(git log -1 --pretty=%s)"
              npm ci
              export NODE_OPTIONS="--max-old-space-size=4096"
              npm run build
              pm2 restart zoiko-suite
              pm2 list
            '
