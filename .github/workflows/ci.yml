name: Frontend CI & PR Gate

on:
  push:
    branches: [main, vasu-deva, vasudeva-reddy]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 24: jsdom 30 (Vitest) needs >= 22.22 / 24.15, and the node tests
      # import .ts files through Node 24's built-in type stripping.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Assistant widget unit tests (Vitest incl. the import boundary) and
      # node tests (Doc 07 §04 L1: deterministic CI, blocking on failure).
      - name: Unit tests
        run: npm test

      - name: Build Next.js Application
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_TELEMETRY_DISABLED: 1

  # The browser tests need access to the backend repository.
  # If BACKEND_REPO_TOKEN is set it will be used; otherwise, the repository
  # is checked for public/authenticated access.
  backend-access:
    name: Backend repo access
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote https://github.com/ZoikoGroup/zoiko-suite-backend.git HEAD >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Assistant browser tests skipped::ZoikoGroup/zoiko-suite-backend is not accessible and BACKEND_REPO_TOKEN is not set."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  # Doc 07 §04 L4 / §10: the assistant's browser tests (axe, keyboard, the
  # public-only boundary, 52 cases) against a real public-ai-svc built from
  # the backend repository.
  assistant-e2e:
    name: Assistant browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: [validate, backend-access]
    if: needs.backend-access.outputs.available == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout the assistant service
        uses: actions/checkout@v4
        with:
          repository: ZoikoGroup/zoiko-suite-backend
          ref: main
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          path: backend
          sparse-checkout: services/public-ai-svc

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: backend/services/public-ai-svc/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies and the browser
        run: |
          npm ci
          npx playwright install --with-deps msedge

      - name: Build Next.js Application
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_TELEMETRY_DISABLED: 1

      - name: Playwright
        run: npx playwright test --reporter=line,html
        env:
          PUBLIC_AI_SVC_DIR: ${{ github.workspace }}/backend/services/public-ai-svc

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
