      - ZOIKO_BENEFITS_URL=http://benefits-svc:8112
      - ZOIKO_PAYROLL_TAX_URL=http://payroll-tax-svc:8113
      - ZOIKO_PAYROLL_EXCEPTIONS_URL=http://payroll-exceptions-svc:8114
      # ── Compliance Domain ──────────────────────────────────────────────────
      - ZOIKO_FILING_TRACKER_URL=http://filing-tracker-svc:8136
      - ZOIKO_COMPLIANCE_STATUS_URL=http://compliance-status-svc:8137
      - ZOIKO_EXCEPTION_ESCALATION_URL=http://exception-escalation-svc:8138
