      - ZOIKO_CONTRACT_LIFECYCLE_URL=http://host.docker.internal:8119
      - ZOIKO_CLAUSE_TEMPLATE_URL=http://host.docker.internal:8120
      - ZOIKO_OBLIGATION_TRACKING_URL=http://host.docker.internal:8121
      - ZOIKO_BOARD_RESOLUTIONS_URL=http://host.docker.internal:8122
