
# ── Shared build context for all mock microservices ──────────────────────────
x-mock-svc: &mock-svc
  image: zoiko-mock-svc:latest
  restart: unless-stopped
  networks:
    - zoiko-net

services:

  # ───────────────────────────────────────────────────────────────────────────
  # FRONTEND
  # ───────────────────────────────────────────────────────────────────────────
  frontend-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zoiko-suite-frontend
    ports:
      - "3001:3000"
    networks:
      - zoiko-net
    environment:
      - NODE_ENV=production
      - PORT=3000
      # ── Group 6 · Legal, Corporate & Commercial ─────────────────────────────
      - ZOIKO_CONTRACT_LIFECYCLE_URL=http://contract-lifecycle-svc:8119
      - ZOIKO_CONTRACTS_URL=http://contract-lifecycle-svc:8119
      - ZOIKO_CLAUSE_TEMPLATE_URL=http://clause-template-svc:8120
      - ZOIKO_OBLIGATION_TRACKING_URL=http://obligation-tracking-svc:8121
      - ZOIKO_BOARD_RESOLUTIONS_URL=http://board-resolutions-svc:8122
      - ZOIKO_CORPORATE_ACTIONS_URL=http://corporate-actions-svc:8123
      - ZOIKO_COUNTERPARTY_MANAGEMENT_URL=http://counterparty-management-svc:8124
      - ZOIKO_COUNTERPARTY_URL=http://counterparty-management-svc:8124
      - ZOIKO_PURCHASE_REQUEST_URL=http://purchase-request-svc:8100
      - ZOIKO_PURCHASE_ORDER_URL=http://purchase-order-svc:8150
      - ZOIKO_SPEND_CONTROLS_URL=http://spend-controls-svc:8131
      - ZOIKO_VENDOR_DUE_DILIGENCE_URL=http://vendor-due-diligence-svc:8132
      - ZOIKO_PROCUREMENT_WORKFLOW_URL=http://procurement-workflow-svc:8134
      # ── Group 7 · Tax & Compliance ─────────────────────────────────────────
      - ZOIKO_TAX_RULES_URL=http://tax-rules-svc:8125
      - ZOIKO_TAX_DETERMINATION_URL=http://tax-determination-svc:8126
      - ZOIKO_VAT_GST_URL=http://vat-gst-svc:8127
      - ZOIKO_CORPORATE_TAX_URL=http://corporate-tax-svc:8128
      - ZOIKO_WITHHOLDING_TAX_URL=http://withholding-tax-svc:8129
      - ZOIKO_FILING_PREPARATION_URL=http://filing-preparation-svc:8130
      - ZOIKO_EVIDENCE_URL=http://filing-preparation-svc:8130
      - ZOIKO_FILING_TRACKER_URL=http://filing-tracker-svc:8151
      - ZOIKO_COMPLIANCE_STATUS_URL=http://compliance-status-svc:8152
      - ZOIKO_EXCEPTION_ESCALATION_URL=http://exception-escalation-svc:8133
      - ZOIKO_TAX_AUTHORITY_INTERFACE_URL=http://tax-authority-svc:8147
      # ── Group 8 · Intelligence & Reporting ─────────────────────────────────
      - ZOIKO_ANOMALY_DETECTION_URL=http://anomaly-detection-svc:8153
      - ZOIKO_FORECASTING_URL=http://forecasting-svc:8135
      - ZOIKO_COMPLIANCE_RISK_SCORING_URL=http://compliance-risk-scoring-svc:8136
      - ZOIKO_RECONCILIATION_INTELLIGENCE_URL=http://reconciliation-intelligence-svc:8137
      - ZOIKO_REPORTING_ORCHESTRATION_URL=http://reporting-orchestration-svc:8138
      - ZOIKO_DECISION_SUPPORT_URL=http://decision-support-svc:8154
      - ZOIKO_MIGRATION_INTEGRITY_URL=http://migration-integrity-svc:8139
      # ── Group 9 · Security & Trust ─────────────────────────────────────────
      - ZOIKO_MTLS_MANAGEMENT_URL=http://mtls-management-svc:8140
      - ZOIKO_SIEM_INTEGRATION_URL=http://siem-integration-svc:8141
      - ZOIKO_CARTA_URL=http://carta-svc:8142
      - ZOIKO_KEY_MANAGEMENT_URL=http://key-management-svc:8143
      # ── Group 10 · Integration & Extensibility ──────────────────────────────
      - ZOIKO_CONNECTIVITY_API_BRIDGE_URL=http://connectivity-api-bridge-svc:8144
      - ZOIKO_BANKING_CONNECTOR_URL=http://banking-connector-svc:8145
      - ZOIKO_HRIS_CONNECTOR_URL=http://hris-connector-svc:8146
      - ZOIKO_ESIGNATURE_INTEGRATION_URL=http://esignature-integration-svc:8148
      - ZOIKO_EXTERNAL_DATA_FEED_URL=http://external-data-feed-svc:8149
      # ── Misc ───────────────────────────────────────────────────────────────
      - NEXT_PUBLIC_DEFAULT_TENANT_ID=tenant-zoiko-dev-01
      - NEXT_PUBLIC_ENABLE_BACKEND_MOCK_FALLBACK=false
    depends_on:
      - tax-rules-svc
      - contract-lifecycle-svc
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # INFRASTRUCTURE
  # ───────────────────────────────────────────────────────────────────────────
  zoiko-postgres:
    image: postgres:16-alpine
    platform: linux/amd64
    container_name: zoiko-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: zoiko
      POSTGRES_PASSWORD: zoiko_dev
      POSTGRES_DB: zoiko_platform
    networks:
      - zoiko-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoiko"]
      interval: 10s
      timeout: 5s
      retries: 5

  zoiko-kafka:
    image: apache/kafka:latest
    container_name: zoiko-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@zoiko-kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://zoiko-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - zoiko-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ───────────────────────────────────────────────────────────────────────────
  # GROUP 6 · LEGAL, CORPORATE & COMMERCIAL  (8119–8124, 8100, 8131, 8132, 8134, 8150)
