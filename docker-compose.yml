      - ZOIKO_PURCHASE_REQUEST_URL=http://purchase-request-svc:8100
      - ZOIKO_PURCHASE_ORDER_URL=http://purchase-order-svc:8139
      - ZOIKO_SPEND_CONTROLS_URL=http://spend-controls-svc:8131
      - ZOIKO_VENDOR_DUE_DILIGENCE_URL=http://vendor-due-diligence-svc:8135
      # ── HR Domain ──────────────────────────────────────────────────────────
