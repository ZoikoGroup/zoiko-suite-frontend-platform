      - ZOIKO_JURISDICTION_RULES_URL=http://jurisdiction-rules-svc:8082
      - ZOIKO_SCHEMA_REGISTRY_URL=http://schema-registry-svc:8093
      - NEXT_PUBLIC_DEFAULT_TENANT_ID=tenant-zoiko-dev-01
      - NEXT_PUBLIC_ENABLE_BACKEND_MOCK_FALLBACK=false
