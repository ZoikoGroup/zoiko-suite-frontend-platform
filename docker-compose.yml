
# ── Shared build context for all 37 mock microservices ────────────────────────
x-mock-svc: &mock-svc
  build:
    context: ./mock-backend
    dockerfile: Dockerfile.mock
  restart: unless-stopped
  networks:
    - zoiko-net

services:

  # ───────────────────────────────────────────────────────────────────────────
  # FRONTEND
  # ───────────────────────────────────────────────────────────────────────────
  frontend-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zoiko-suite-frontend
    ports:
      - "3001:3000"
    networks:
      - zoiko-net
    environment:
      - NODE_ENV=production
      - PORT=3000
      # ── Tax Domain ─────────────────────────────────────────────────────────
      - ZOIKO_TAX_RULES_URL=http://tax-rules-svc:8125
      - ZOIKO_TAX_DETERMINATION_URL=http://tax-determination-svc:8126
      - ZOIKO_VAT_GST_URL=http://vat-gst-svc:8127
      - ZOIKO_CORPORATE_TAX_URL=http://corporate-tax-svc:8128
      - ZOIKO_WITHHOLDING_TAX_URL=http://withholding-tax-svc:8129
      - ZOIKO_FILING_PREPARATION_URL=http://filing-preparation-svc:8130
      - ZOIKO_EVIDENCE_URL=http://filing-preparation-svc:8130
      - ZOIKO_TAX_AUTHORITY_INTERFACE_URL=http://tax-authority-svc:8147
      # ── Legal Domain ───────────────────────────────────────────────────────
      - ZOIKO_CONTRACT_LIFECYCLE_URL=http://contract-lifecycle-svc:8119
      - ZOIKO_CONTRACTS_URL=http://contract-lifecycle-svc:8119
      - ZOIKO_CLAUSE_TEMPLATE_URL=http://clause-template-svc:8120
      - ZOIKO_OBLIGATION_TRACKING_URL=http://obligation-tracking-svc:8121
      - ZOIKO_OBLIGATIONS_URL=http://obligation-tracking-svc:8088
      - ZOIKO_BOARD_RESOLUTIONS_URL=http://board-resolutions-svc:8122
      - ZOIKO_CORPORATE_ACTIONS_URL=http://corporate-actions-svc:8123
      - ZOIKO_COUNTERPARTY_MANAGEMENT_URL=http://counterparty-management-svc:8124
      - ZOIKO_COUNTERPARTY_URL=http://counterparty-management-svc:8124
      # ── Finance Domain ─────────────────────────────────────────────────────
      - ZOIKO_GENERAL_LEDGER_URL=http://general-ledger-svc:8098
      - ZOIKO_ACCOUNTS_PAYABLE_URL=http://accounts-payable-svc:8099
      - ZOIKO_ACCOUNTS_RECEIVABLE_URL=http://accounts-receivable-svc:8101
      - ACCOUNTS_RECEIVABLE_SVC_URL=http://accounts-receivable-svc:8101
      - ZOIKO_BANK_RECONCILIATION_URL=http://bank-reconciliation-svc:8102
      - ZOIKO_TREASURY_URL=http://treasury-svc:8103
      - ZOIKO_FINANCIAL_CLOSE_URL=http://financial-close-svc:8104
      - FINANCIAL_CLOSE_SVC_URL=http://financial-close-svc:8104
